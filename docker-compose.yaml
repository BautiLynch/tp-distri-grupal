services:
  rabbitmq:
    build:
      context: ./src/rabbitmq
    volumes:
      - ./src/rabbitmq/logging.conf:/etc/rabbitmq/conf.d/20-logging.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 50s
    ports:
      - "5672:5672"
      - "15672:15672"

  gateway:
    build:
      context: ./src
      dockerfile: gateway/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      filter_0:
        condition: service_healthy
      filter_1:
        condition: service_healthy
      splitter_0:
        condition: service_healthy
      splitter_1:
        condition: service_healthy
    environment:
      MOM_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "5678"
      HANDLER_HOST: handler
      HANDLER_PORT: "5679"
      FILTER_PREFIX: filter
      FILTER_AMOUNT: "2"
      SPLITTER_PREFIX: splitter
      SPLITTER_AMOUNT: "2"

  handler:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build:
      context: ./src
      dockerfile: handler/Dockerfile
    environment:
      MOM_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "5679"
      INPUT_EXCHANGE: results
      QUERY_1_REPLICAS: "2"
      QUERY_2_REPLICAS: "2"
      QUERY_3_REPLICAS: "2"
      QUERY_4_REPLICAS: "1"
      QUERY_5_REPLICAS: "2"

  client_0:
    profiles: ["dos"]
    <<: *cliente
    environment:
      <<: *cliente-env
      INPUT_PATH: /datasets/wikipedia-1000.jsonl
      OUTPUT_PATH: /output/output_0.bin

  client_1:
    profiles: ["dos"]
    <<: *cliente
    environment:
      <<: *cliente-env
      INPUT_PATH: /datasets/wikipedia-1000.jsonl
      OUTPUT_PATH: /output/output_1.bin

  client_v1_a:
    <<: *cliente
    environment:
      <<: *cliente-env
      INPUT_PATH: /datasets/wikipedia-1000.jsonl
      OUTPUT_PATH: /output/v1_cliente_a.bin

  client_v1_b:
    <<: *cliente
    environment:
      <<: *cliente-env
      INPUT_PATH: /datasets/wikipedia-1000.jsonl
      OUTPUT_PATH: /output/v1_cliente_b.bin

  client_v2_a:
    <<: *cliente
    environment:
      <<: *cliente-env
      INPUT_PATH: /datasets/wikipedia-1000-v2.jsonl
      OUTPUT_PATH: /output/v2_cliente_a.bin

  client_v2_b:
    <<: *cliente
    environment:
      <<: *cliente-env
      INPUT_PATH: /datasets/wikipedia-1000-v2.jsonl
      OUTPUT_PATH: /output/v2_cliente_b.bin

  filter_0:
    <<: *filter

  filter_1:
    <<: *filter
    environment:
      <<: *filter-env
      ID: "1"

  image_getter_0:
    <<: *image-getter

  image_getter_1:
    <<: *image-getter
    environment:
      <<: *image-getter-env
      ID: "1"

  splitter_0:
    <<: *splitter

  splitter_1:
    <<: *splitter
    environment:
      <<: *splitter-env
      ID: "1"

  filter_language_0:
    <<: *filter-language
    volumes:
      - filter_language_storage_0:/storage

  filter_language_1:
    <<: *filter-language
    environment:
      <<: *filter-language-env
      ID: "1"
    volumes:
      - filter_language_storage_1:/storage

  aggregation_0:
    <<: *aggregation
    volumes:
      - aggregation_storage_0:/storage

  aggregation_1:
    <<: *aggregation
    environment:
      <<: *aggregation-env
      ID: "1"
    volumes:
      - aggregation_storage_1:/storage

  join:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build:
      context: ./src
      dockerfile: join/Dockerfile
    environment:
      READINESS_FILE: /tmp/worker-ready
      MOM_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      INPUT_QUEUE: join_queue
      OUTPUT_EXCHANGE: results
      AGGREGATION_AMOUNT: "2"
      TOP_SIZE: "20"
    healthcheck: *healthcheck

  filter_year_0:
    <<: *filter-year
    volumes:
      - filter_year_storage_0:/storage

  filter_year_1:
    <<: *filter-year
    environment:
      <<: *filter-year-env
      ID: "1"
    volumes:
      - filter_year_storage_1:/storage

  average_0:
    <<: *average
    volumes:
      - average_storage_0:/storage

  average_1:
    <<: *average
    environment:
      <<: *average-env
      ID: "1"
    volumes:
      - average_storage_1:/storage

  filter_average_0:
    <<: *filter-average
    volumes:
      - filter_average_storage_0:/storage

  filter_average_1:
    <<: *filter-average
    environment:
      <<: *filter-average-env
      ID: "1"
    volumes:
      - filter_average_storage_1:/storage

networks:
  default:
    name: tp-distri-grupal-network

volumes:
  aggregation_storage_0:
  aggregation_storage_1:
  filter_language_storage_0:
  filter_language_storage_1:
  filter_year_storage_0:
  filter_year_storage_1:
  average_storage_0:
  average_storage_1:
  filter_average_storage_0:
  filter_average_storage_1:
