        target: /storage
        type: volume
        volume: {}
  handler:
    container_name: handler
    build:
      context: ./src
      dockerfile: handler/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
        required: true
    env_file: .env
    environment:
      INPUT_EXCHANGE: results
      QUERY_1_REPLICAS: "3"
      QUERY_2_REPLICAS: "1"
      QUERY_3_REPLICAS: "3"
      QUERY_4_REPLICAS: "1"
      QUERY_5_REPLICAS: "3"
