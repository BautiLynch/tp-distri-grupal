networks:
  default:
    name: tp-distri-grupal-network
    ipam:
      config:
        # Las IPs dinamicas salen de ip_range (172.28.128.0 - 172.28.255.255).
        # La mitad baja queda para IPs fijas: los monitores usan 172.28.0.10, .11, .12, ...
        - subnet: 172.28.0.0/16
          ip_range: 172.28.128.0/17
services:
  aggregation_0:
    container_name: aggregation_0
    build:
      context: ./src
      dockerfile: aggregation/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
        required: true
    env_file: .env
    environment:
      ID: "0"
      INPUT_EXCHANGE: splitter_output
      OUTPUT_QUEUE: join_queue
      SPLITTER_AMOUNT: "3"
      STORAGE_PATH: /storage
      TOP_SIZE: "20"
    volumes:
      - source: aggregation_storage_0
        target: /storage
        type: volume
        volume: {}
  aggregation_1:
    container_name: aggregation_1
