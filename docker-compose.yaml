services:
  rabbitmq:
    build:
      context: ./src/rabbitmq
    environment:
      RABBITMQ_LOG_LEVELS: error
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 50s
    ports:
      - "5672:5672"
      - "15672:15672"

  gateway:
    build:
      context: ./src
      dockerfile: gateway/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      filter_0:
        condition: service_healthy
      splitter_0:
        condition: service_healthy
    environment:
      MOM_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "5678"
      HANDLER_HOST: handler
      HANDLER_PORT: "5679"
      FILTER_PREFIX: filter
      FILTER_AMOUNT: "1"
      SPLITTER_PREFIX: splitter
      SPLITTER_AMOUNT: "1"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 5678), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10

  handler:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build:
      context: ./src
      dockerfile: handler/Dockerfile
    environment:
      MOM_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "5679"
      INPUT_EXCHANGE: results
      QUERY_1_REPLICAS: "1"
      QUERY_2_REPLICAS: "1"
      QUERY_3_REPLICAS: "1"
      QUERY_4_REPLICAS: "1"
      QUERY_5_REPLICAS: "1"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 5679), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10

  client_0:
    build:
      context: ./src
      dockerfile: client/Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
      handler:
        condition: service_healthy
      filter_0:
        condition: service_healthy
      image_getter_0:
        condition: service_healthy
      splitter_0:
        condition: service_healthy
      filter_language_0:
        condition: service_healthy
      aggregation_0:
        condition: service_healthy
      join:
        condition: service_healthy
      filter_year_0:
        condition: service_healthy
      average_0:
        condition: service_healthy
      filter_average_0:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      GATEWAY_HOST: gateway
      GATEWAY_PORT: "5678"
      INPUT_PATH: /datasets/wikipedia-1000.jsonl
      OUTPUT_PATH: /output/output_0.bin
      CONNECTION_TIMEOUT: "10"
    volumes:
      - ./datasets:/datasets:ro
      - ./output:/output

  filter_0:
    build:
      context: ./src
      dockerfile: filter/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      image_getter_0:
        condition: service_healthy
    environment:
      READINESS_FILE: /tmp/worker-ready
      MOM_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      ID: "0"
      INPUT_EXCHANGE: filter
      OUTPUT_EXCHANGE_1: results
      OUTPUT_EXCHANGE_2: image_getter
      IMAGE_GETTER_PREFIX: image_getter
      IMAGE_GETTER_AMOUNT: "1"
      LANGUAGE: en
      SECTIONS: Biography,Biographie
      YEAR: "2020"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 10s

  image_getter_0:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build:
      context: ./src
      dockerfile: image-getter/Dockerfile
    environment:
      READINESS_FILE: /tmp/worker-ready
      MOM_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      ID: "0"
      INPUT_EXCHANGE: image_getter
      OUTPUT_EXCHANGE: results
      FILTER_YEAR_PLUS_AMOUNT: "1"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 10s

  splitter_0:
    build:
      context: ./src
      dockerfile: splitter/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      filter_language_0:
        condition: service_healthy
      aggregation_0:
        condition: service_healthy
      filter_year_0:
        condition: service_healthy
    environment:
      READINESS_FILE: /tmp/worker-ready
      MOM_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      ID: "0"
      INPUT_EXCHANGE: splitter
      EXCHANGE_QUERY_3: filter_language
      EXCHANGE_QUERY_4: aggregation
      EXCHANGE_QUERY_5: filter_year
      STOPWORDS_PATH: /stopwords
      AGGREGATION_AMOUNT: "1"
      FILTER_YEAR_AMOUNT: "1"
      FILTER_LANGUAGE_AMOUNT: "1"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 10s

  filter_language_0:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build:
      context: ./src
      dockerfile: filter-language/Dockerfile
    environment:
      READINESS_FILE: /tmp/worker-ready
      MOM_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      ID: "0"
      INPUT_EXCHANGE: filter_language
      OUTPUT_EXCHANGE: results
      SPLITTER_AMOUNT: "1"
      STORAGE_PATH: /storage
    volumes:
      - filter_language_storage:/storage
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 10s

  aggregation_0:
    build:
      context: ./src
      dockerfile: aggregation/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      join:
        condition: service_healthy
    environment:
      READINESS_FILE: /tmp/worker-ready
      MOM_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      ID: "0"
      INPUT_EXCHANGE: aggregation
      OUTPUT_QUEUE: join_queue
      SPLITTER_AMOUNT: "1"
      TOP_SIZE: "20"
      STORAGE_PATH: /storage
    volumes:
      - aggregation_storage:/storage
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 10s

  join:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build:
      context: ./src
      dockerfile: join/Dockerfile
    environment:
      READINESS_FILE: /tmp/worker-ready
      MOM_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      INPUT_QUEUE: join_queue
      OUTPUT_EXCHANGE: results
      AGGREGATION_AMOUNT: "1"
      TOP_SIZE: "20"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 10s

  filter_year_0:
    build:
      context: ./src
      dockerfile: filter-year/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      average_0:
        condition: service_healthy
      filter_average_0:
        condition: service_healthy
    environment:
      READINESS_FILE: /tmp/worker-ready
      MOM_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      ID: "0"
      INPUT_EXCHANGE: filter_year
      AVERAGE_EXCHANGE: average
      AVERAGE_AMOUNT: "1"
      FILTER_AVERAGE_EXCHANGE: filter_average
      FILTER_AVERAGE_AMOUNT: "1"
      SPLITTER_AMOUNT: "1"
      YEAR: "2020"
      STORAGE_PATH: /storage
    volumes:
      - filter_year_storage:/storage
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 10s

  average_0:
    build:
      context: ./src
      dockerfile: average/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      filter_average_0:
        condition: service_healthy
    environment:
      READINESS_FILE: /tmp/worker-ready
      MOM_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      ID: "0"
      AVERAGE_PREFIX: average
      INPUT_EXCHANGE: average
      OUTPUT_EXCHANGE: filter_average
      FILTER_AVERAGE_AMOUNT: "1"
      YEAR: "2021"
      STORAGE_PATH: /storage
    volumes:
      - average_storage:/storage
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 10s

  filter_average_0:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build:
      context: ./src
      dockerfile: filter-average/Dockerfile
    environment:
      READINESS_FILE: /tmp/worker-ready
      MOM_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      ID: "0"
      INPUT_EXCHANGE: filter_average
      OUTPUT_EXCHANGE: results
      AVERAGE_AMOUNT: "1"
      FILTER_YEAR_AMOUNT: "1"
      YEAR: "2020"
      STORAGE_PATH: /storage
    volumes:
      - filter_average_storage:/storage
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 10s

volumes:
  aggregation_storage:
  filter_language_storage:
  filter_year_storage:
  average_storage:
  filter_average_storage:
