      ID: "2"
    volumes:
      - source: /var/run/docker.sock
        target: /var/run/docker.sock
        type: bind
  rabbitmq:
    build:
      context: ./src/rabbitmq
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
      - mode: ingress
        protocol: tcp
        published: "5672"
        target: 5672
      - mode: ingress
        protocol: tcp
        published: "15672"
        target: 15672
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: ./src/rabbitmq/logging.conf
        target: /etc/rabbitmq/conf.d/20-logging.conf
        type: bind
  splitter_0:
    container_name: splitter_0
    build:
      context: ./src
      dockerfile: splitter/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
        required: true
    env_file: .env
    environment:
      AGGREGATION_AMOUNT: "3"
      FILTER_LANGUAGE_AMOUNT: "3"
      FILTER_YEAR_AMOUNT: "3"
      ID: "0"
      INPUT_EXCHANGE: splitter
      OUTPUT_EXCHANGE: splitter_output
      STOPWORDS_PATH: /stopwords
  splitter_1:
    container_name: splitter_1
    build:
      context: ./src
      dockerfile: splitter/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
        required: true
