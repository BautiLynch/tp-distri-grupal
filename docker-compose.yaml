services:
  aggregation_0:
    build:
      context: ./src/
      dockerfile: aggregation/Dockerfile
    container_name: aggregation_0
    depends_on:
    - join
    environment:
    - AGGREGATION_AMOUNT=1
    - AGGREGATION_PREFIX=aggregation
    - ID=0
    - MOM_HOST=rabbitmq
    - OUTPUT_QUEUE=join_queue
    - PYTHONUNBUFFERED=1
    - TOP_SIZE=20
    volumes:
      - ./aggregation/storage:/storage
  rabbitmq:
      build:
        context: ./src/rabbitmq
        dockerfile: Dockerfile
      container_name: rabbitmq
      environment:
      - RABBITMQ_LOG_LEVELS=error
      healthcheck:
        interval: 5s
        retries: 10
        start_period: 50s
        test: rabbitmq-diagnostics check_port_connectivity
        timeout: 3s
      ports:
      - 5672:5672
      - 15672:15672