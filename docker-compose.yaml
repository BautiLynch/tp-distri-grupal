        condition: service_healthy
        required: true
    environment:
      AGGREGATION_AMOUNT: "3"
      INPUT_QUEUE: join_queue
      MOM_HOST: rabbitmq
      OUTPUT_EXCHANGE: results
      PYTHONUNBUFFERED: "1"
      TOP_SIZE: "20"
  rabbitmq:
    build:
      context: ./src/rabbitmq
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
      - mode: ingress
        protocol: tcp
        published: "5672"
        target: 5672
      - mode: ingress
        protocol: tcp
        published: "15672"
        target: 15672
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: ./src/rabbitmq/logging.conf
        target: /etc/rabbitmq/conf.d/20-logging.conf
        type: bind
  splitter_0:
    build:
      context: ./src
      dockerfile: splitter/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
        required: true
    environment:
      AGGREGATION_AMOUNT: "3"
      EXCHANGE_QUERY_3: filter_language
      EXCHANGE_QUERY_4: aggregation
      EXCHANGE_QUERY_5: filter_year
      FILTER_LANGUAGE_AMOUNT: "3"
      FILTER_YEAR_AMOUNT: "3"
      ID: "0"
      INPUT_EXCHANGE: splitter
      MOM_HOST: rabbitmq
      PYTHONUNBUFFERED: "1"
      STOPWORDS_PATH: /stopwords
